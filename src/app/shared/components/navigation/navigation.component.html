<div #serviceNavigation class="govuk-service-navigation" data-module="govuk-service-navigation">
  <div class="govuk-width-container">
    <div class="govuk-service-navigation__container">
      <nav class="govuk-service-navigation__wrapper" aria-label="Primary navigation">
        <button type="button" class="govuk-service-navigation__toggle govuk-js-service-navigation-toggle"
          aria-controls="service-navigation" hidden aria-hidden="true">
          Menu
        </button>
        <ul class="govuk-service-navigation__list" id="service-navigation">
          <li class="govuk-service-navigation__item">
            <a id="ccd-search-link" class="govuk-service-navigation__link" href="/ccd-search?takePayment=true&servicerequest=false">Case Transaction</a>
          </li>
          <li class="govuk-service-navigation__item">
            <a id="ccd-payment-link" class="govuk-service-navigation__link" href="/payment-history?takePayment=false&servicerequest=false">Payment history</a>
          </li>
          <li class="govuk-service-navigation__item">
            <a id="service-requests-link" class="govuk-service-navigation__link" href="/service-requests?takePayment=false&servicerequest=true">Service Requests</a>
          </li>
          <li *ngIf="isBulkscanningEnable" class="govuk-service-navigation__item">
            <a id="reports-link" class="govuk-service-navigation__link" href="/payment-history/view?view=reports">Reports</a>
          </li>
          <li class="govuk-service-navigation__item">
            <span class="govuk-service-navigation__text govuk-!-font-weight-bold">{{ todaysDate | date:'dd MMM yyyy' }}</span>
          </li>
          <li class="govuk-service-navigation__item">
            <a class="govuk-service-navigation__link" href="/logout">Logout</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
