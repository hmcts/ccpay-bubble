<h3 class="govuk-heading-m">{{title}}</h3>
<p>{{content}}</p>
<table aria-label="cookie-details" class="govuk-table" >
    <thead class="govuk-table__head">
      <tr class="govuk-table__row">
        <th class="govuk-table__header" scope="col" *ngFor="let label of labelArray"> {{label}}</th>
    </tr>
    </thead>
    <tbody>
    <tr class="govuk-table__row" *ngFor="let cookie of cookieObject">
      <th class="govuk-table__header" scope="row">{{cookie.name}}</th>
      <td class="govuk-table__cell">{{cookie.purpose}}</td>
      <td class="govuk-table__cell">{{cookie.expires}}</td>
    </tr>
    </tbody>
</table>
