<table class="govuk-table" style="margin-bottom: 20px">
  <tbody>
    <tr *ngIf="fee.code">
      <th class="govuk-table__header" scope="row" width="330px">Fee code</th>
      <td class="govuk-table__cell">{{ fee.code }}</td>
    </tr>
    <tr *ngIf="fee.version">
      <th class="govuk-table__header" scope="row" width="330px">Fee version</th>
      <td class="govuk-table__cell">{{ fee.version }}</td>
    </tr>
    <tr *ngIf="fee.volume_amount">
      <th class="govuk-table__header" scope="row" width="330px">Volume amount</th>
      <td class="govuk-table__cell">£{{ fee.volume_amount | number:'.2' }}</td>
    </tr>
    <tr *ngIf="fee.calculated_amount">
      <th class="govuk-table__header" scope="row" width="330px">Calculated amount</th>
      <td class="govuk-table__cell">£{{ fee.calculated_amount | number:'.2' }}</td>
    </tr>
    <tr *ngIf="fee.memo_line">
      <th class="govuk-table__header" scope="row" width="330px">Memo line</th>
      <td class="govuk-table__cell">{{ fee.memo_line }}</td>
    </tr>
    <tr *ngIf="fee.natural_account_code">
      <th class="govuk-table__header" scope="row" width="330px">Natural account code</th>
      <td class="govuk-table__cell">{{ fee.natural_account_code }}</td>
    </tr>
  </tbody>
</table>
