<table class="govuk-table" style="margin-bottom: 20px">
  <tbody>
    <tr *ngIf="statusHistory.status">
      <th class="govuk-table__header" scope="row" width="330px">Status</th>
      <td class="govuk-table__cell">{{ statusHistory.status }}</td>
    </tr>
    <tr *ngIf="statusHistory.date_created">
      <th class="govuk-table__header" scope="row" width="330px">Date created</th>
      <td class="govuk-table__cell">{{ statusHistory.date_created | date:'dd MMM yyyy hh:mm:ss' }}</td>
    </tr>
  </tbody>
</table>
